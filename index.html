<!DOCTYPE html>
<html lang="en">

<head>
    <title>Hundryd</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="Pictures/logo.png">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <main class="container">
        <img src="Pictures/logo.png" alt="Hundryd Logo" class="logo">

        <nav class="social-links" aria-label="Social links">
            <a href="https://www.patreon.com/Hundryd" target="_blank" rel="noopener noreferrer" aria-label="Patreon">
                <img src="Pictures/patreon.png" alt="" class="social-icon">
            </a>
            <a href="https://www.youtube.com/@hundryd" target="_blank" rel="noopener noreferrer"
                aria-label="YouTube">
                <img src="Pictures/youtube.png" alt="" class="social-icon">
            </a>
            <a href="https://open.spotify.com/artist/56K0Hjik9o8LLNT6zlMQNB?si=8MREer-tRGiI3cuuL9EJZQ"
                target="_blank" rel="noopener noreferrer" aria-label="Spotify">
                <img src="Pictures/spotify.png" alt="" class="social-icon">
            </a>
            <a href="https://music.apple.com/us/artist/hundryd/1652977120" target="_blank" rel="noopener noreferrer"
                aria-label="Apple Music">
                <img src="Pictures/apple.png" alt="" class="social-icon">
            </a>
            <a href="https://music.amazon.com/artists/B0BLF4MRFK/hundryd" target="_blank" rel="noopener noreferrer"
                aria-label="Amazon Music">
                <img src="Pictures/amazon.png" alt="" class="social-icon">
            </a>
        </nav>
    </main>

    <button id="updateButton" class="update-toast" type="button" aria-live="polite">
        <span class="update-text">Website update</span>
        <span class="update-action">Refresh</span>
    </button>
    <script src="index.js"></script>
</body>

</html>
